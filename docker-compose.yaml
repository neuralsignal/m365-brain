# Full-stack local testing with PostgreSQL (matching production).
# Azurite emulator available via: docker compose --profile azurite up
#
# Usage:
#   docker compose up --build        # build + start all services
#   docker compose up -d postgres    # start only postgres (for local dev against pg)
#   docker compose --profile azurite up  # include Azurite blob emulator
#   docker compose down -v           # stop + remove volumes

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: m365admin
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: m365extract
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m365admin -d m365extract"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://m365admin:localdev@postgres:5432/m365extract
      M365_ADMIN_CONFIG: config/base.yaml,config/auth.yaml,config/storage/local.yaml,config/service/web.yaml,config/env/local.yaml

  daemon:
    build:
      context: .
      dockerfile: Dockerfile.daemon
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://m365admin:localdev@postgres:5432/m365extract

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    profiles: ["azurite"]
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck"

volumes:
  pgdata:
