auth:
    client_id: "${MSAL_CLIENT_ID}"
    tenant_id: "${MSAL_TENANT_ID}"
    scopes:
        - "User.Read"
        - "Mail.Read"
        - "Calendars.Read"
        - "Chat.Read"
        - "ChannelMessage.Read.All"
        - "Files.Read.All"
        - "Sites.Read.All"
        - "Contacts.Read"
        - "User.Read.All"
        # - "Directory.Read.All"
        - "offline_access"
    token_cache_path: "./state/token_cache.json"

service:
    mode: "cli"
    log_level: "INFO"
    json_logs: false
    continuous_poll_seconds: 30
    max_consecutive_auth_failures: 5

storage:
    backend: "azure_blob"
    azure_blob:
        connection_string: "${AZURE_STORAGE_CONNECTION_STRING}"
        container_name: "${AZURE_STORAGE_CONTAINER}"
        prefix: "${AZURE_STORAGE_PREFIX}"

graph:
    max_retries: 3
    backoff_base_ms: 2000
    timeout_seconds: 30
    max_pages: 100

state:
    state_file_path: "./state/sync_state.json"

extractors:
    email:
        enabled: true
        poll_interval_minutes: 3
        folders: ["Inbox", "SentItems", "Archive"]
        lookback_days: 365
        max_items_per_sync: 500
    calendar:
        enabled: true
        poll_interval_minutes: 60
        lookback_days: 365
        forward_days: 90
    teams_chats:
        enabled: true
        poll_interval_minutes: 5
        max_messages_per_chat: 200
    teams_channels:
        enabled: false
        poll_interval_minutes: 5
    onedrive:
        enabled: false
        poll_interval_minutes: 120
        eager_convert_patterns: []
        convertible_extensions:
            [".docx", ".pptx", ".xlsx", ".pdf", ".csv", ".txt", ".md", ".html"]
        max_file_size_mb: 100
    sharepoint:
        enabled: false
        poll_interval_minutes: 240
        eager_convert_patterns: []
        convertible_extensions:
            [".docx", ".pptx", ".xlsx", ".pdf", ".csv", ".txt", ".md", ".html"]
        max_file_size_mb: 100
    contacts:
        enabled: false
        poll_interval_minutes: 1440
        max_items_per_sync: 500
        include_contact_folders: false
    directory:
        enabled: false
        poll_interval_minutes: 10080
        include_manager_chain: true
        include_direct_reports: true
        only_active_users: true

converters:
    backends:
        pdf: "markitdown"
        docx: "markitdown"
        pptx: "markitdown"
        xlsx: "markitdown"
        csv: "markitdown"
        json: "native"
        yaml: "native"
        image: "native"
        default: "native"
    extraction:
        timeout_seconds: 30
        max_file_size_mb: 100
        xlsx_max_rows_per_sheet: 500
    media:
        extract_images: false
        image_format: "png"
        image_max_dimension: 0
