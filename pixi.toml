[workspace]
channels = ["conda-forge"]
name = "m365-extract"
platforms = ["linux-64", "osx-arm64"]
version = "0.2.2" # x-release-please-version

[dependencies]
python = ">=3.12,<3.13"
python-build = ">=1.4.0,<2"
hatchling = ">=1.28.0,<2"

[pypi-dependencies]
msal = ">=1.34, <2"
httpx = ">=0.28, <1"
pyyaml = ">=6.0, <7"
python-frontmatter = ">=1.1, <2"
markdownify = ">=0.14, <1"
structlog = ">=25.0, <26"
click = ">=8.1, <9"
python-dotenv = ">=1.0, <2"
m365-extract = {path = ".", editable = true, extras = ["azure"]}
obsidian-import = {version = ">=1.0.1,<2", extras = ["markitdown"]}
pytest = ">=8.0, <9"
hypothesis = ">=6.100, <7"
pytest-httpx = ">=0.35, <1"
pytest-cov = ">=5.0, <6"
ruff = ">=0.11, <1"
pre-commit = ">=4.0, <5"
mkdocs = ">=1.6, <2"
mkdocs-material = ">=9.5, <10"
mkdocstrings = {version = ">=0.29, <1", extras = ["python"]}

[tasks]
lint = "ruff check m365_extract/ tests/"
format-check = "ruff format --check m365_extract/ tests/"
format = "ruff format m365_extract/ tests/"
test = "pytest tests/ -v --tb=short -m 'not integration and not azurite'"
test-cov = "pytest tests/ -v --tb=short --cov=m365_extract --cov-report=term-missing -m 'not integration and not azurite'"
test-azurite = "pytest tests/ -v --tb=short -m azurite"
pre-commit-install = "pre-commit install"
docs-build = "mkdocs build"
docs-serve = "mkdocs serve"
