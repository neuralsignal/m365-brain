[workspace]
channels = ["conda-forge"]
name = "m365-extract"
platforms = ["linux-64", "osx-arm64"]
version = "0.3.0" # x-release-please-version

[dependencies]
python = ">=3.12,<3.13"
pip = ">=26.0,<28"
python-build = ">=1.4.0,<2"
hatchling = ">=1.28.0,<2"
setuptools = ">=78.1.1,<79"

[pypi-dependencies]
msal = ">=1.34, <2"
pyjwt = ">=2.12.0, <3"
httpx = ">=0.28, <1"
pyyaml = ">=6.0, <7"
pydantic = ">=2.12, <3"
python-frontmatter = ">=1.1, <2"
markdownify = ">=0.14, <1"
urllib3 = ">=2.6.3, <3"
structlog = ">=25.0, <26"
click = ">=8.1, <9"
python-dotenv = ">=1.0, <2"
pyopenssl = ">=26.0, <27"
cryptography = ">=46.0.6, <49"
sqlmodel = ">=0.0.22,<1"
jinja2 = ">=3.1.6, <4"
m365-extract = {path = ".", editable = true, extras = ["azure"]}
obsidian-import = {version = ">=1.0.1,<2", extras = ["markitdown"]}
pillow = ">=12.2.0, <13"
pypdf = ">=6.9.2, <7"
pytest = ">=9.0.3, <10"
hypothesis = ">=6.100, <7"
pytest-httpx = ">=0.35, <1"
pytest-cov = ">=5.0, <6"
ruff = ">=0.11, <1"
pre-commit = ">=4.0, <5"
requests = ">=2.33.0, <3"
mkdocs = ">=1.6, <2"
mkdocs-material = ">=9.5, <10"
mkdocstrings = {version = ">=0.29, <1", extras = ["python"]}

[tasks]
lint = "ruff check m365_extract/ m365_admin/ tests/"
format-check = "ruff format --check m365_extract/ m365_admin/ tests/"
format = "ruff format m365_extract/ m365_admin/ tests/"
test = "pytest tests/ -v --tb=short -m 'not integration and not azurite and not admin'"
test-cov = "pytest tests/ -v --tb=short --cov=m365_extract --cov-report=term-missing -m 'not integration and not azurite and not admin'"
test-azurite = "pytest tests/ -v --tb=short -m azurite"
pre-commit-install = "pre-commit install"
docs-build = "mkdocs build"
docs-serve = "mkdocs serve"

[feature.admin.dependencies]
nodejs = ">=20,<21"

[feature.admin.pypi-dependencies]
reflex = ">=0.8.28,<0.9"
sqlmodel = ">=0.0.22,<1"

[feature.admin.tasks]
dev = "reflex run"
migrate = "alembic upgrade head"
makemigrations = "alembic revision --autogenerate"
test-admin = "pytest tests/ -v --tb=short -m 'not integration and not azurite'"
test-all = "pytest tests/ -v --tb=short -m 'not integration and not azurite'"

[environments]
admin = ["admin"]
