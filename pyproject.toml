[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "m365-extract"
version = "1.1.0"
description = "Microsoft 365 data extraction to Obsidian-compatible markdown via Graph API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Matthias Christenson" },
]
keywords = ["microsoft-365", "graph-api", "obsidian", "markdown", "sync", "extraction", "email", "calendar", "teams", "onedrive", "sharepoint"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business",
]
dependencies = [
    "msal>=1.34,<2",
    "httpx>=0.28,<1",
    "pyyaml>=6.0,<7",
    "pydantic>=2.12,<3",
    "python-frontmatter>=1.1,<2",
    "markdownify>=0.14,<1",
    "structlog>=25.0,<26",
    "click>=8.1,<9",
    "python-dotenv>=1.0,<2",
    "pyopenssl>=26.0,<27",
    "cryptography>=46.0.6,<49",
]

[project.optional-dependencies]
azure = [
    "azure-storage-blob>=12.24,<13",
]
convert = [
    "obsidian-import[markitdown,docling]>=1.2.0,<2",
]
admin = [
    "reflex>=0.8.28,<0.9",
    "sqlmodel>=0.0.22,<1",
    "psycopg2-binary>=2.9,<3",
]
all = [
    "m365-extract[azure,convert,admin]",
]
dev = ["pytest>=9.0.3,<10", "hypothesis>=6.100,<7", "pytest-cov>=5.0,<6", "pytest-httpx>=0.35,<1"]

[project.urls]
Documentation = "https://neuralsignal.github.io/m365-extract/"
Repository = "https://github.com/neuralsignal/m365-extract"

[project.scripts]
m365-extract = "m365_extract.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["m365_extract"]

[tool.hatch.build.targets.sdist]
include = ["m365_extract/"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"m365_admin/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require real Graph API credentials",
    "azurite: tests that require Azurite emulator",
    "admin: tests that require reflex (admin env only)",
]
