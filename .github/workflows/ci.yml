name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          cache: true
          locked: false
      - run: pixi run lint
      - run: pixi run format-check

  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Stdlib-only by design, so they run on stock python3 with no environment
      # to set up -- a broken pixi env cannot make a guardrail silently pass.
      - name: Repository structure
        run: python3 scripts/check_structure.py
      - name: No consuming-workspace references
        run: python3 scripts/check_no_workspace.py
      - name: Trellis templates carry no bilingual Chinese
        run: python3 scripts/check_trellis_cjk.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          cache: true
          locked: false
      - name: Run unit tests with coverage
        run: pixi run test-cov
      - name: Start Azurite
        run: |
          docker run -d --name azurite \
            -p 10000:10000 -p 10001:10001 -p 10002:10002 \
            mcr.microsoft.com/azure-storage/azurite \
            azurite --skipApiVersionCheck --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
          sleep 2
      - name: Run Azurite integration tests
        run: pixi run test-azurite

  test-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          cache: true
          locked: false
          environments: admin
      - name: Run all tests (including admin)
        run: pixi run -e admin test-all
