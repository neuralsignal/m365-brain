# m365-extract web mode config template.
# Copy this file and fill in env vars before use.
# All ${VAR} references are expanded from environment variables at load time.

auth:
  client_id: "${AZURE_CLIENT_ID}"
  tenant_id: "${AZURE_TENANT_ID}"
  scopes: ["User.Read", "Mail.Read", "Calendars.Read", "Contacts.Read", "Files.Read.All", "Sites.Read.All", "Chat.Read", "ChannelMessage.Read.All"]
  token_cache_path: "./state/token_cache.json"
  client_secret: "${AZURE_CLIENT_SECRET}"

service:
  mode: "web"
  log_level: "INFO"

storage:
  backend: "local"
  local:
    base_path: "./vault"

graph:
  max_retries: 3
  backoff_base_ms: 2000
  timeout_seconds: 30
  max_pages: 100

state:
  state_file_path: "./state/sync_state.json"

extractors:
  email:
    enabled: true
    poll_interval_minutes: 3
    folders: ["Inbox", "SentItems"]
    lookback_days: 365
    max_items_per_sync: 500
  calendar:
    enabled: true
    poll_interval_minutes: 60
    lookback_days: 365
  teams_chats:
    enabled: true
    poll_interval_minutes: 5
    max_messages_per_chat: 200
  teams_channels:
    enabled: false
    poll_interval_minutes: 5
  onedrive:
    enabled: false
    poll_interval_minutes: 120
    eager_convert_patterns: []
    convertible_extensions: [".docx", ".pdf"]
    max_file_size_mb: 100
  sharepoint:
    enabled: false
    poll_interval_minutes: 240
    eager_convert_patterns: []
    convertible_extensions: [".docx", ".pdf"]
    max_file_size_mb: 100
  contacts:
    enabled: false
    poll_interval_minutes: 1440
    max_items_per_sync: 500
    include_contact_folders: false
  directory:
    enabled: false
    poll_interval_minutes: 10080
    include_manager_chain: true
    include_direct_reports: true
    only_active_users: true

converters:
  backends:
    pdf: "markitdown"
    docx: "markitdown"
    default: "native"
  extraction:
    timeout_seconds: 30
    max_file_size_mb: 100
    xlsx_max_rows_per_sheet: 500

web:
  host: "0.0.0.0"
  port: 8000
  secret_key: "${SECRET_KEY}"
  fernet_key: "${FERNET_KEY}"
  db_path: "./state/web.db"
  session_timeout_minutes: 60
