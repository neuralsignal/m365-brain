repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pixi-lock
        name: pixi lock
        entry: bash -c 'pixi install --locked 2>/dev/null || { pixi lock && git add pixi.lock; }'
        language: system
        files: pixi\.toml$
        pass_filenames: false
      - id: check-structure
        name: repository structure
        entry: python3 scripts/check_structure.py
        language: system
        pass_filenames: false
      - id: check-publishable
        name: no real-world identifiers
        entry: python3 scripts/check_publishable.py
        language: system
        pass_filenames: false
      - id: check-trellis-cjk
        name: trellis templates carry no bilingual Chinese
        entry: python3 scripts/check_trellis_cjk.py --quiet
        language: system
        pass_filenames: false
