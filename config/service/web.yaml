# Web/daemon service mode — auth code flow with client secret.
# Overrides auth section from auth.yaml for web deployments.

auth:
  client_id: "${AZURE_CLIENT_ID}"
  tenant_id: "${AZURE_TENANT_ID}"
  scopes: ["User.Read", "Mail.Read", "Calendars.Read", "Contacts.Read", "Files.Read.All", "Sites.Read.All", "Chat.Read", "ChannelMessage.Read.All"]
  token_cache_path: "../state/token_cache.json"
  client_secret: "${AZURE_CLIENT_SECRET}"

service:
  mode: "web"
  log_level: "INFO"
  json_logs: false
  continuous_poll_seconds: 30
  max_consecutive_auth_failures: 5

extractors:
  email:
    # `folders` is per-mailbox, so narrowing it means restating the mailbox
    # entry -- a list in an override file replaces the base list whole.
    # This block previously set `folders` directly under `email`, one level too
    # high, where nothing read it. `extra="forbid"` now rejects that placement
    # instead of ignoring it, which is how the mistake finally surfaced.
    mailboxes:
      - address: "me"
        folders: ["Inbox", "SentItems"]
        output_subdir: ""
  onedrive:
    convertible_extensions: [".docx", ".pdf"]
  sharepoint:
    convertible_extensions: [".docx", ".pdf"]

converters:
  backends:
    pdf: "markitdown"
    docx: "markitdown"
    default: "native"

web:
  host: "0.0.0.0"
  port: 8000
  secret_key: "${SECRET_KEY}"
  fernet_key: "${FERNET_KEY}"
  db_path: "../state/web.db"
  session_timeout_minutes: 60
  db_url: "${DATABASE_URL}"
  admin_emails:
    - "${ADMIN_EMAIL}"

worker:
  max_concurrent_jobs: 4
  poll_interval_seconds: 30
