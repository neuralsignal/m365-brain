# Standalone test config — reduced scope, small limits.
# Used as-is (not composed with other fragments).

auth:
  client_id: "${MSAL_CLIENT_ID}"
  tenant_id: "${MSAL_TENANT_ID}"
  scopes:
    - "User.Read"
    - "Mail.Read"
    - "Calendars.Read"
    - "offline_access"
  token_cache_path: "../state/token_cache.json"
  client_secret: null

service:
  mode: "cli"
  log_level: "INFO"
  json_logs: false
  continuous_poll_seconds: 30
  max_consecutive_auth_failures: 5

storage:
  backend: "local"
  local:
    base_path: "../vault"

graph:
  max_retries: 3
  backoff_base_ms: 2000
  timeout_seconds: 30
  max_pages: 100
  max_retry_after_seconds: 300.0
  error_message_max_length: 200

state:
  state_file_path: "../state/sync_state.json"

extractors:
  email:
    enabled: true
    poll_interval_minutes: 3
    mailboxes:
      - address: "me"
        folders: ["Inbox"]
        output_subdir: ""
    lookback_days: 30
    max_items_per_sync: 10
    download_attachments: false
    max_attachment_size_mb: 25
    attachment_convert_extensions: []
  calendar:
    enabled: true
    poll_interval_minutes: 60
    lookback_days: 30
    forward_days: 90
  teams_chats:
    enabled: false
    poll_interval_minutes: 5
    max_messages_per_chat: 200
    download_attachments: false
    download_inline_images: false
    max_attachment_size_mb: 25
    attachment_convert_extensions: []
  teams_channels:
    enabled: false
    poll_interval_minutes: 5
    max_messages_per_channel: 200
    channels: null
    download_attachments: false
    download_inline_images: false
    max_attachment_size_mb: 25
    attachment_convert_extensions: []
  onedrive:
    enabled: false
    poll_interval_minutes: 120
    eager_convert_patterns: []
    convertible_extensions: [".docx", ".pdf"]
    max_file_size_mb: 100
  sharepoint:
    enabled: false
    poll_interval_minutes: 240
    eager_convert_patterns: []
    convertible_extensions: [".docx", ".pdf"]
    max_file_size_mb: 100
  contacts:
    enabled: false
    poll_interval_minutes: 1440
    max_items_per_sync: 500
    include_contact_folders: false
  directory:
    enabled: false
    poll_interval_minutes: 10080
    include_manager_chain: true
    include_direct_reports: true
    only_active_users: true

converters:
  backends:
    pdf: "markitdown"
    docx: "markitdown"
    default: "native"
  extraction:
    timeout_seconds: 30
    max_file_size_mb: 100
    xlsx_max_rows_per_sheet: 500
  slug_max_length: 80
  hash_length: 6
