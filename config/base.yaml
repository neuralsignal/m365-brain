# Shared configuration: graph, state, extractors, converters.
# Loaded by all modes. Override individual values in service/ and env/ fragments.

graph:
  max_retries: 3
  backoff_base_ms: 2000
  timeout_seconds: 30
  max_pages: 100
  max_retry_after_seconds: 300.0
  error_message_max_length: 200

state:
  state_file_path: "../state/sync_state.json"

extractors:
  email:
    enabled: true
    poll_interval_minutes: 3
    mailboxes:
      - address: "me"
        folders: ["Inbox", "SentItems", "Archive"]
        output_subdir: ""
    lookback_days: 365
    max_items_per_sync: 500
    download_attachments: false
    max_attachment_size_mb: 25
    attachment_convert_extensions: []
  calendar:
    enabled: true
    poll_interval_minutes: 60
    lookback_days: 365
    forward_days: 90
  teams_chats:
    enabled: true
    poll_interval_minutes: 5
    max_messages_per_chat: 200
    download_attachments: false
    download_inline_images: false
    max_attachment_size_mb: 25
    attachment_convert_extensions: []
  teams_channels:
    enabled: false
    poll_interval_minutes: 5
    max_messages_per_channel: 200
    channels: null
    download_attachments: false
    download_inline_images: false
    max_attachment_size_mb: 25
    attachment_convert_extensions: []
  onedrive:
    enabled: true
    poll_interval_minutes: 120
    eager_convert_patterns: []
    convertible_extensions: [".docx", ".pptx", ".xlsx", ".pdf", ".csv", ".txt", ".md", ".html"]
    max_file_size_mb: 100
  sharepoint:
    enabled: true
    poll_interval_minutes: 240
    eager_convert_patterns: []
    convertible_extensions: [".docx", ".pptx", ".xlsx", ".pdf", ".csv", ".txt", ".md", ".html"]
    max_file_size_mb: 100
  contacts:
    enabled: true
    poll_interval_minutes: 1440
    max_items_per_sync: 500
    include_contact_folders: false
  directory:
    enabled: false
    poll_interval_minutes: 10080
    include_manager_chain: true
    include_direct_reports: true
    only_active_users: true

converters:
  backends:
    pdf: "markitdown"
    docx: "markitdown"
    pptx: "markitdown"
    xlsx: "markitdown"
    csv: "markitdown"
    json: "native"
    yaml: "native"
    image: "native"
    default: "native"
  extraction:
    isolation: "process"   # true kill on timeout; use "thread" for lowest CLI latency
    timeout_seconds: 30
    max_file_size_mb: 100
    xlsx_max_rows_per_sheet: 500
  media:
    extract_images: false
    image_format: "png"
    image_max_dimension: 0
  slug_max_length: 80
  hash_length: 6
